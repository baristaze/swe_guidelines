# The local queues: every queue in acme.infra.queues.Queues under the local
# prefix (ACME_SQS_QUEUE_PREFIX=acme-), each with a dead-letter queue after
# five receives, as the queue module declares them in the cloud. The
# include keeps the image's defaults: the SQS API on 0.0.0.0:9324.
include classpath("application.conf")

queues {
  acme-webhooks-dead {}
  acme-webhooks {
    deadLettersQueue {
      name = "acme-webhooks-dead"
      maxReceiveCount = 5
    }
  }
}
