# The desired state of the WorkOS application Acme signs people in
# through, per WorkOS environment. `uv run acme-ops workos-bootstrap
# --environment <name>` reads it and reconciles WorkOS with it: a dry run by
# default, `--apply` to write.
#
# A WorkOS environment is not a Acme environment. `staging` serves the
# local stack and Acme's staging; `production` serves production alone.
# Each Acme environment still accepts only its own callback: the API's
# ACME_SIGN_IN_REDIRECT_URIS names it, and a deployed one refuses anything
# else.
#
# The client id is the Acme App application's, and it is not a secret. The
# API key is, and it is that application's own key (Applications, Acme
# App, API keys), never the environment's (API Keys): the command proves
# it before anything else, reads it from the variable named here, and never
# prints it. The key reads and writes the application's redirect list.
# The Redirects tab's other fields have no API; the command prints them as
# checks to make on the tab. The sign-out URIs are among them: where WorkOS's
# logout sends a person once the sign-out has ended their AuthKit session.
# Each Acme environment names its own in ACME_SIGN_OUT_RETURN_URIS, and the
# API refuses any other return.

staging:
  api_key_variable: WORKOS_API_KEY
  client_id: client_STAGING_PLACEHOLDER
  redirect_uris:
    - http://localhost:55173/auth/callback
    - http://localhost:5173/auth/callback
    - https://app.staging.acme.example/auth/callback
  # The deployed callback, so nothing WorkOS sends on its own lands on a
  # laptop's port.
  default_redirect_uri: https://app.staging.acme.example/auth/callback
  login_initiation_uri: https://app.staging.acme.example/login
  app_homepage_url: https://app.staging.acme.example
  sign_out_uris:
    - http://localhost:55173/signed-out
    - http://localhost:5173/signed-out
    - https://app.staging.acme.example/signed-out
  # The deployed page, for the same reason as the default redirect.
  default_sign_out_uri: https://app.staging.acme.example/signed-out
  # Where the provider delivers its organization events; the endpoint is
  # made on the dashboard, with its secret in ACME_WORKOS_WEBHOOK_SECRET.
  webhooks:
    - https://api.staging.acme.example/webhooks/identity

production:
  api_key_variable: WORKOS_PRODUCTION_API_KEY
  client_id: client_PRODUCTION_PLACEHOLDER
  redirect_uris:
    - https://app.acme.example/auth/callback
  default_redirect_uri: https://app.acme.example/auth/callback
  login_initiation_uri: https://app.acme.example/login
  app_homepage_url: https://app.acme.example
  sign_out_uris:
    - https://app.acme.example/signed-out
  default_sign_out_uri: https://app.acme.example/signed-out
  # Where the provider delivers its organization events; the endpoint is
  # made on the dashboard, with its secret in ACME_WORKOS_WEBHOOK_SECRET.
  webhooks:
    - https://api.acme.example/webhooks/identity
