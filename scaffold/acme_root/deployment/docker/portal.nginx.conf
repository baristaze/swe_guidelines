# A request that asks for an upgrade keeps asking; any other closes its
# connection to the api as usual.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# The portal is a single-page app: a path that is not a file is a client
# route, so it gets index.html. Hashed assets cache forever; the page never.
# The API's paths go to the api container, the realtime socket included, so
# the page calls the API on its own origin, as it does behind the cloud's
# distribution: no request is cross-origin, and no browser sends a preflight.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The API bounds a body itself; the socket's pings, every 20 and 25
        # seconds, keep it inside the default read timeout of 60.
        client_max_body_size 0;
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
