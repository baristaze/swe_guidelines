[project]
name = "acme-integrations"
version = "0.7.0"
description = "Acme third-party providers: one interface per provider, its real client, and a deterministic twin."
requires-python = ">=3.14"
dependencies = [
    "acme-infra",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28.1",
    "aiohttp>=3.14",
    "slack-sdk>=3.36",
    # Pinned exactly: the identity provider's wire shapes are what the twin
    # mirrors and the fixtures record, so an upgrade is a change of its own.
    "workos==10.4.0",
    # Pinned exactly: the payment processor's API version is the one this
    # release was built against, and every call names it.
    "stripe==15.6.1",
]

[tool.uv.sources]
acme-infra = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
