[project]
name = "acme-api"
version = "0.1.0"
description = "The Acme API process: gateway, routers, realtime channel, and the ops CLI."
requires-python = ">=3.14"
dependencies = [
    "acme-om",
    "acme-infra",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic-settings>=2.15",
]

[project.scripts]
acme-api = "acme.services.api.entry:main"

[tool.uv.sources]
acme-om = { workspace = true }
acme-infra = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
