[project]
name = "acme-cli"
version = "0.7.0"
description = "The Acme command line: one command at a time, or a listener that prints what the team does as it happens."
requires-python = ">=3.14"
dependencies = [
    "acme-client",
    "typer>=0.15",
]

[project.scripts]
acme = "acme.apps.cli.main:main"

[tool.uv.sources]
acme-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
