[project]
name = "acme-ops"
version = "0.7.0"
description = "The Acme operations package: the traffic generator, the stress test, and the signal readers."
requires-python = ">=3.14"
dependencies = [
    "acme-client",
    "acme-infra",
    "acme-integrations",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "aioboto3>=15.5",
]

[project.scripts]
acme-ops = "acme.ops.main:main"

[tool.uv.sources]
acme-client = { workspace = true }
acme-infra = { workspace = true }
acme-integrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
