[project]
name = "acme-infra"
version = "0.1.0"
description = "Acme infrastructure capabilities: cache, buckets, topics, queues, secrets, flags, observability."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
    "aioboto3>=15.5",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "prometheus-client>=0.26",
    "truststore>=0.10.4",
    "valkey-glide>=2.5.2",
    "sentry-sdk>=2.69.2",
    "openfeature-sdk>=0.10.0",
    "launchdarkly-server-sdk>=9.18.1",
    "launchdarkly-openfeature-server>=0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
