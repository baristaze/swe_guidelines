[project]
name = "acme-om"
version = "0.7.0"
description = "The Acme object model: entities, managers, storage, migrations."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "acme-infra",
    "acme-integrations",
    "cryptography>=50.0",
]

[tool.uv.sources]
acme-infra = { workspace = true }
acme-integrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
