line-length = 100
target-version = "py314"
src = ["libs/timing/src", "om/src", "infra/src", "integrations/src", "services/api/src", "workers/maintenance/src", "clients/python/src", "apps/cli/src", "ops/src"]
# Generated from the committed OpenAPI documents by `make openapi`; never hand-edited.
extend-exclude = ["clients/python/src/acme/client/schema"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF", "N"]
ignore = ["RUF012", "UP042", "N818"]

# The formatter holds code to 100 columns. A string or a comment runs longer
# once a copy takes a longer name, so the line rule leaves it room.
[lint.pycodestyle]
max-line-length = 120

[lint.isort]
known-first-party = ["acme"]
# The storage contract cases, imported by name from om/tests: a block of
# their own after the product's, so a copy under another name sorts them
# the same way.
known-local-folder = ["contracts"]

[format]
quote-style = "double"
