[project]
name = "acme-maintenance"
version = "0.7.0"
description = "The Acme maintenance worker: the claim loop, the sweep, and what Slack sends."
requires-python = ">=3.14"
dependencies = [
    "acme-om",
    "acme-infra",
    "acme-integrations",
    "pydantic-settings>=2.15",
]

[project.scripts]
acme-maintenance = "acme.workers.maintenance.entry:main"

[tool.uv.sources]
acme-om = { workspace = true }
acme-infra = { workspace = true }
acme-integrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
