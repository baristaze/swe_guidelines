name: review-om
kind: skill
# In a container only. On the host the subject runs as the harness's
# user and can read the checkout, the planted findings in it.
runtimes: [container]
subject:
  skill: arch-review-om
  prompt: "Review {target} against the object model lenses and report findings by lens id."
  max_turns: 30
  # About ten times what one review has cost; Claude Code stops the session there.
  max_usd: 3
  allowed_tools: [Read, Grep, Glob]
  # A checkout with ten defects planted. `--target`
  # reviews another checkout instead; the judges still get its source,
  # and the expected findings are dropped because they describe this one.
  target: ../fixtures/review-om
  timeout_s: 1800
artifact:
  stdout: true
  files: []
evidence:
  files: ["om/**/*.py", "om/pyproject.toml"]
  expected: ../fixtures/review-om.expected.yaml
  # The text of each lens the review cites, so a judge reads the rule.
  lenses: true
rubric: |
  Score the review 0 to 100 as the author of the guideline would. The
  evidence holds the source the review read, with line numbers, the
  text of each lens the review cites, and, on the scenario's own
  target, the planted findings and what the checkout does right. Score against the evidence, not against how
  sure the review sounds.

  Most of the score is recall and precision. Each planted finding the
  review reports, at the right file and near the right line, earns its
  share; a planted defect reported under another lens earns part of it.
  Each finding the source does not bear out, and each flag on something
  the evidence lists as correct, takes points off. A true finding that
  is not on the list is neither credit nor penalty. With no planted
  list, verify each finding against the source and score precision.

  The rest is form. A good finding names its lens id, points at a file
  and a line, quotes the rule it rests on, and says what to change. It
  separates what the guideline requires from what the reviewer prefers.

  Take points off for a lens id that does not exist, for advice the
  guideline does not support, and for a review that edits or stages
  anything instead of reporting.
judges:
  providers: 3
  effort: high
