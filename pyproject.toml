# Tool configuration for the checkers under scripts/ and their tests.
# This repository is not a Python package: nothing here is built or
# published, and uv does not manage it as a project. The release version
# lives in .claude-plugin/plugin.json, never here.

[project]
name = "swe-guidelines-checks"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.uv]
managed = false

[tool.ruff]
line-length = 130
src = ["scripts", "tests", "benchmark"]
include = ["scripts/**/*.py", "tests/**/*.py", "benchmark/**/*.py"]
extend-exclude = ["benchmark/runs", "benchmark/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "conftest", "harness"]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "tests", "benchmark"]
exclude = ["^benchmark/runs/", "^benchmark/fixtures/"]
mypy_path = ["scripts", "tests", "benchmark"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
