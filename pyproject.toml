# Tool configuration for the checkers under scripts/ and their tests.
# This repository is not a Python package: nothing here is built or
# published, and uv does not manage it as a project. The release version
# lives in .claude-plugin/plugin.json, never here.

[project]
name = "swe-guidelines-checks"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.uv]
managed = false

[tool.ruff]
line-length = 130
src = ["scripts", "tests"]
include = ["scripts/**/*.py", "tests/**/*.py"]
# benchmark/ and its tests come under the same tools in a change of their own.
extend-exclude = ["benchmark", "tests/test_benchmark_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "conftest"]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "tests"]
exclude = ["^benchmark/", "^tests/test_benchmark_"]
mypy_path = "scripts"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
