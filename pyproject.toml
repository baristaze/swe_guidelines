# Tool configuration for the checkers under scripts/ and their tests.
# This repository is not a Python package: nothing here is built or
# published, and uv does not manage it as a project. The one package it
# holds, arch-check, has its own pyproject.toml under checkers/. The
# release version lives in .claude-plugin/plugin.json, never here.

[project]
name = "swe-guidelines-checks"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.uv]
managed = false

[tool.ruff]
line-length = 130
src = ["scripts", "tests", "benchmark", "checkers/src"]
include = ["scripts/**/*.py", "tests/**/*.py", "benchmark/**/*.py", "checkers/**/*.py"]
extend-exclude = ["benchmark/runs", "benchmark/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "conftest", "harness"]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "tests", "benchmark", "checkers/src"]
exclude = ["^benchmark/runs/", "^benchmark/fixtures/"]
mypy_path = ["scripts", "tests", "benchmark", "checkers/src"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# The benchmark imports these inside the functions that use them, and
# make mypy runs without them installed: their types are not checked.
[[tool.mypy.overrides]]
module = ["anthropic", "google", "google.*", "jsonschema", "openai", "pydantic", "websockets", "yaml"]
ignore_missing_imports = true

# arch-check under checkers/src needs Python 3.11 for tomllib; the
# scripts keep the 3.10 floor above, and mypy has one python_version
# per run. Under 3.10 rules tomllib has no stub, so it reads as Any
# here. The checker's own tests run on 3.11 and later, where it is real.
[[tool.mypy.overrides]]
module = ["tomllib"]
ignore_missing_imports = true
