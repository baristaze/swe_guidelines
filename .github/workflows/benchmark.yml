name: benchmark

# Manual only: a run calls paid providers and takes minutes per scenario.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "scenario names separated by spaces, or 'all'"
        default: "all"
        type: string
      providers:
        description: "judges as a bit flag (1 Anthropic, 2 OpenAI, 4 Gemini, 8 xAI) or names; empty keeps each scenario's own"
        default: ""
        type: string
      effort:
        description: "judge effort (low, medium, high); empty keeps each scenario's own"
        default: ""
        type: string
      repeat:
        description: "how many times each subject runs"
        default: "3"

        type: string

permissions:
  contents: read

# One run per ref at a time. A second dispatch waits and never cancels
# the first: a run in progress has already spent money on the providers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: every scenario, judged
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    # The provider keys are the run step's alone. Everything is installed
    # before it, in steps that hold no key: the harness's dependencies from
    # benchmark/run.py.lock, and the container image with Claude Code in it.
    # The run step is offline to uv, so it runs what was installed and
    # fetches nothing.
    #
    # The subject runs in the container runtime. On the host it would run
    # as this job's user and could read the run step's environment, the
    # judges' keys with it, and the answer files in the checkout; in the
    # container it sees its three mounts and the one key it is handed, its
    # own, never a judge's.

    steps:
      # Actions are pinned by commit; the comment names the tag the commit carries.
      # No token left in .git/config for the subject to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.14"
      - name: install the harness, locked, before any key is in reach
        run: uv sync --locked --script benchmark/run.py
      - name: build the subject's image, before any key is in reach
        # The image carries Claude Code at a pinned version. The subject of
        # a skill scenario is `claude -p` inside it, signed in with the one
        # key the container is handed.
        run: docker build -t swe-guidelines-benchmark:latest -f benchmark/runtime/Dockerfile benchmark/runtime
      - name: run every scenario
        # Each scenario brings its own target, if it needs one; a target
        # passed to all of them would drop the planted findings of one.
        # The inputs reach the shell as variables, never as text spliced
        # into the script. A failing scenario is recorded and the rest
        # still run; the step fails at the end if any of them did.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # The subject's own key: the harness hands it to the subject as
          # ANTHROPIC_API_KEY, and never hands on a judge's key.
          SUBJECT_ANTHROPIC_API_KEY: ${{ secrets.SUBJECT_ANTHROPIC_API_KEY }}

          SCENARIOS: ${{ inputs.scenarios }}
          PROVIDERS: ${{ inputs.providers }}
          EFFORT: ${{ inputs.effort }}
          REPEAT: ${{ inputs.repeat }}
          UV_OFFLINE: "1"
        run: |
          set -uo pipefail
          set -f  # a scenario name is never a glob
          if ! [[ "$PROVIDERS" =~ ^$|^[0-9]+$|^[a-z]+(,[a-z]+)*$ ]]; then
            echo "::error::providers is empty, a number, or comma-separated names, got '$PROVIDERS'"
            exit 2
          fi
          if ! [[ "$EFFORT" =~ ^(low|medium|high)?$ ]]; then
            echo "::error::effort is empty, low, medium, or high, got '$EFFORT'"
            exit 2
          fi
          # An empty input passes no flag, so the scenario's own judges and effort hold.
          judges=()
          [ -n "$PROVIDERS" ] && judges+=(--providers "$PROVIDERS")
          [ -n "$EFFORT" ] && judges+=(--effort "$EFFORT")
          if ! [[ "$REPEAT" =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::repeat is a whole number from 1 to 99, got '$REPEAT'"
            exit 2
          fi
          if [ "$SCENARIOS" = "all" ]; then
            # The suffixes benchmark/harness/scenario.py catalogs; one name per stem.
            names=$(find benchmark/scenarios -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
              | xargs -n1 basename | sed -E 's/\.(yaml|yml|json)$//' | sort -u)
          else
            names="$SCENARIOS"
          fi
          failed=()
          for name in $names; do
            echo "::group::$name"
            if ! uv run --locked benchmark/run.py --scenario "$name" \
              ${judges[@]+"${judges[@]}"} \
              --strict --repeat "$REPEAT" --out benchmark/runs \
              --runtime container --claude claude; then
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed scenarios: ${failed[*]}"
            exit 1
          fi
      - name: write the summary
        if: always()
        run: |
          for report in benchmark/runs/*/report.md; do
            [ -f "$report" ] || continue
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      - name: keep every run as evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-runs
          # The run folders hold the record: streams, artifacts, judgements,
          # results. The subject's HOME, TMPDIR, and workspace lived in a
          # sandbox outside them and are gone; the exclusions keep it so if
          # an older run folder is ever in the tree.
          path: |
            benchmark/runs
            !benchmark/runs/*/home
            !benchmark/runs/*/tmp
            !benchmark/runs/*/workspace
          if-no-files-found: warn
          retention-days: 30
