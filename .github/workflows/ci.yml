name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref. A new push to a pull request cancels the run it
# replaces; a push to main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the floor pyproject.toml declares, and the latest stable release
        python: ["3.10", "3.14"]
    steps:
      # Actions are pinned by commit; the comment names the tag the commit carries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tool versions live in .github/pins/, where dependabot updates them.
      - name: read the tool pins
        id: pins
        run: |
          echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
          echo "claude=$(sed -n 's|^ *"@anthropic-ai/claude-code": *"\([^"]*\)".*|\1|p' .github/pins/package.json)" >> "$GITHUB_OUTPUT"
      # Both setup actions cache their downloads between runs. The npm cache
      # holds Claude Code and markdownlint; the uv cache holds Python, pytest,
      # pyyaml, jsonschema, ruff, and mypy. Each key is the file that pins the versions.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: .github/pins/package.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            .github/pins/requirements.txt
            Makefile
      - name: install Claude Code
        # `claude plugin validate` needs no account, so `make plugin` runs here too.
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pins.outputs.claude }}
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: make check
        run: make check

  arch-check:
    # arch-check needs Python 3.11 (tomllib), a newer floor than the
    # scripts'. Its tests skip on 3.10, so they run here on the floor
    # itself, and the wheel is built and its entry point run.
    name: arch-check on Python 3.11, from its built wheel
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the tool pins
        id: pins
        run: echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}
          python-version: "3.11"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            .github/pins/requirements.txt
            checkers/pyproject.toml
            Makefile
      - name: the tests, the arch-check ones included, on its floor
        run: make test
      - name: build the wheel and run the arch-check entry point from it
        run: make checkers-dist

  # A copy of the scaffold, made the way a project starts, passes its own
  # gates: the fast gate with arch-check from this checkout, the integration
  # suite over its compose stack, and its release-before job. So the
  # scaffold stays runnable as the guideline moves. Each is a job of its own,
  # and all start at once, so a copy takes as long as its longest job, not
  # their sum.
  scaffold-check:
    name: a copy of the scaffold as ${{ matrix.name }} passes its fast gate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One word; the benchmark's two words; and two words at the longest
        # name new.py takes, whose lines grow the most.
        name: [pressroom, free_journalism, independent_press]
    env:
      COPY: ${{ github.workspace }}/../${{ matrix.name }}
      # uv sync and uv run fail instead of rewriting a stale uv.lock.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the tool pins
        id: pins
        run: echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: scaffold/acme_root/uv.lock
      - name: copy the scaffold under a name of its own
        run: time python3 scaffold/new.py "$COPY"
      # No pnpm step: `make setup` installs pnpm, at the version the copy's
      # packageManager names, as it does for a person on a Node with no pnpm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scaffold/acme_root/.nvmrc
      - name: make setup
        working-directory: ${{ env.COPY }}
        run: make setup
      # arch-check runs from this checkout's checkers/, on the copy's Python.
      - name: make check, with arch-check from this checkout
        working-directory: ${{ env.COPY }}
        run: make check ARCH_CHECK="uv run --no-project --python $(cat .python-version) python $GITHUB_WORKSPACE/checkers/arch_check.py"

  scaffold-integration:
    name: a copy of the scaffold as ${{ matrix.name }} passes its integration suite
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The names scaffold-check takes.
        name: [pressroom, free_journalism, independent_press]
    env:
      COPY: ${{ github.workspace }}/../${{ matrix.name }}
      # uv sync and uv run fail instead of rewriting a stale uv.lock.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the tool pins
        id: pins
        run: echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: scaffold/acme_root/uv.lock
      - name: copy the scaffold under a name of its own
        run: time python3 scaffold/new.py "$COPY"
      # The Python packages alone, as the copy's own integration job installs
      # them: the suite runs no Node and no pnpm.
      - name: install the copy's packages
        working-directory: ${{ env.COPY }}
        run: uv sync --all-packages
      - name: the integration suite over the copy's compose stack
        working-directory: ${{ env.COPY }}
        run: |
          cp .env.example .env
          make infra-up
          make migrate
          make migrate-check
          make test-integration
      - name: stop the copy's stack
        if: always()
        working-directory: ${{ env.COPY }}
        run: make infra-down || true

  # The copy's release-before job, on a branch that adds a migration. The
  # copy as committed is the release before; the branch adds a revision to
  # queue's chain that changes nothing, which no chain of the release
  # before holds, so its suite runs only once the stamp works. One name
  # stands for the three: the script is the same in each. The release
  # before ends its queue chain on a revision of its own whose stamp sorts
  # below its parent's, as a layer's own revision may. So the chain's head
  # is not its highest stamp, and the step reads it by the parents, with
  # the copy's own reader; a head read by sorting makes a second head.
  scaffold-release-before:
    name: a copy of the scaffold as free_journalism passes its release before
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      COPY: ${{ github.workspace }}/../free_journalism
      # uv sync and uv run fail instead of rewriting a stale uv.lock.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the tool pins
        id: pins
        run: echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: scaffold/acme_root/uv.lock
      - name: copy the scaffold under a name of its own
        run: time python3 scaffold/new.py "$COPY"
      # The script brings the copy's stack up itself, as the copy's own
      # release-before job runs it.
      - name: the copy's release before passes on a branch that adds a migration
        working-directory: ${{ env.COPY }}
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: |
          git rev-parse -q --verify HEAD > /dev/null || { git add -A && git commit -qm "the copy"; }
          queue_head() {
            uv run --package free-journalism-om python -c 'from free_journalism.om.storage.migrate import head; from free_journalism.om.storage.roles import DatabaseRole; print(head(DatabaseRole.QUEUE))'
          }
          nothing() {
            printf 'revision = "%s"\ndown_revision = "%s"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    pass\n\n\ndef downgrade() -> None:\n    pass\n' "$1" "$(queue_head)" \
              > "om/migrations/versions/queue/$1_nothing.py"
            git add om/migrations && git commit -qm "$2"
          }
          nothing 200001010000 "a revision of the copy's own, stamped below its parent"
          test "$(queue_head)" = 200001010000
          base="$(git rev-parse HEAD)"
          nothing 209912310000 "a revision that changes nothing"
          scripts/release_before.sh "$base"
      - name: stop the copy's stack
        if: always()
        working-directory: ${{ env.COPY }}
        run: make infra-down || true
