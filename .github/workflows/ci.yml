name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref. A new push to a pull request cancels the run it
# replaces; a push to main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the floor pyproject.toml declares, and the latest stable release
        python: ["3.10", "3.14"]
    steps:
      # Actions are pinned by commit; the comment names the tag the commit carries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tool versions live in .github/pins/, where dependabot updates them.
      - name: read the tool pins
        id: pins
        run: |
          echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
          echo "claude=$(sed -n 's|^ *"@anthropic-ai/claude-code": *"\([^"]*\)".*|\1|p' .github/pins/package.json)" >> "$GITHUB_OUTPUT"
      # Both setup actions cache their downloads between runs. The npm cache
      # holds Claude Code and markdownlint; the uv cache holds Python, pytest,
      # pyyaml, jsonschema, ruff, and mypy. Each key is the file that pins the versions.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: .github/pins/package.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            .github/pins/requirements.txt
            Makefile
      - name: install Claude Code
        # `claude plugin validate` needs no account, so `make plugin` runs here too.
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pins.outputs.claude }}
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: make check
        run: make check

  arch-check:
    # arch-check needs Python 3.11 (tomllib), a newer floor than the
    # scripts'. Its tests skip on 3.10, so they run here on the floor
    # itself, and the wheel is built and its entry point run.
    name: arch-check on Python 3.11, from its built wheel
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the tool pins
        id: pins
        run: echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
          python-version: "3.11"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            .github/pins/requirements.txt
            checkers/pyproject.toml
            Makefile
      - name: the tests, the arch-check ones included, on its floor
        run: make test
      - name: build the wheel and run the arch-check entry point from it
        run: make checkers-dist

  scaffold:
    # A copy of the scaffold, made the way a project starts, passes its own
    # gates: the fast gate, the integration suite over its compose stack,
    # and arch-check from this checkout. So the scaffold stays runnable as
    # the guideline moves.
    name: a copy of the scaffold as ${{ matrix.name }} passes its own gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One word; the benchmark's two words; and two words at the longest
        # name new.py takes, whose lines grow the most.
        name: [pressroom, free_journalism, independent_press]
    env:
      COPY: ${{ github.workspace }}/../${{ matrix.name }}
      # uv sync and uv run fail instead of rewriting a stale uv.lock.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the tool pins
        id: pins
        run: echo "uv=$(sed -n 's|^uv==||p' .github/pins/requirements.txt)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.pins.outputs.uv }}
          enable-cache: true
          cache-dependency-glob: scaffold/acme_root/uv.lock
      - name: copy the scaffold under a name of its own
        run: time python3 scaffold/new.py "$COPY"
      # The pnpm version comes from packageManager in the copy's package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ../${{ matrix.name }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scaffold/acme_root/.nvmrc
      - name: make setup
        working-directory: ${{ env.COPY }}
        run: make setup
      # arch-check runs from this checkout's checkers/, on the copy's Python.
      - name: make check, with arch-check from this checkout
        working-directory: ${{ env.COPY }}
        run: make check ARCH_CHECK="uv run --no-project --python $(cat .python-version) python $GITHUB_WORKSPACE/checkers/arch_check.py"
      - name: the integration suite over the copy's compose stack
        working-directory: ${{ env.COPY }}
        run: |
          cp .env.example .env
          make infra-up
          make migrate
          make migrate-check
          make test-integration
      - name: stop the copy's stack
        if: always()
        working-directory: ${{ env.COPY }}
        run: make infra-down || true
