name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: markdown, lenses, leaks, links, prose, toc, version, skills, agents, tests, plugin
    runs-on: ubuntu-26.04
    steps:
      # Actions are pinned by commit; the comment names the tag the commit carries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: install pytest and Claude Code
        # `claude plugin validate` needs no account, so `make plugin` runs here too.
        run: |
          python -m pip install pytest==9.1.1
          npm install -g @anthropic-ai/claude-code@2.1.276
      - name: make check
        run: make check
