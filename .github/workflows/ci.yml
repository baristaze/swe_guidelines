name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref. A new push to a pull request cancels the run it
# replaces; a push to main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # the floor pyproject.toml declares, and the latest stable release
        python: ["3.10", "3.14"]
    steps:
      # Actions are pinned by commit; the comment names the tag the commit carries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both setup actions cache their downloads between runs. The npm cache
      # holds Claude Code and markdownlint; the uv cache holds Python,
      # pytest, ruff, and mypy. Each key is the file that pins the versions.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: .github/workflows/ci.yml
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            .github/workflows/ci.yml
            Makefile
      - name: install Claude Code
        # `claude plugin validate` needs no account, so `make plugin` runs here too.
        run: npm install -g @anthropic-ai/claude-code@2.1.276
      - name: make check
        run: make check PYTHON="uv run --no-project --with pytest==9.1.1 python"
